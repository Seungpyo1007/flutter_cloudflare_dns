name: flutter_cloudflare_dns
description: "Android-first Flutter toolkit for diagnosing and managing Cloudflare DNS records."
version: 0.0.3
homepage: https://seungpyo.online
repository: https://github.com/Seungpyo1007/flutter_cloudflare_dns
issue_tracker: https://github.com/Seungpyo1007/flutter_cloudflare_dns/issues
topics:
  - cloudflare
  - dns
  - networking
  - minecraft
screenshots:
  - description: Material 3 Android dashboard, DNS record summary, and SRV editor.
    path: assets/android-showcase.png
  - description: High-resolution Android walkthrough of the dashboard and SRV record editor.
    path: assets/flutter_cloudflare_dns-demo.webp
  - description: Android Material 3 DNS record editor.
    path: assets/android-record-editor.png

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
